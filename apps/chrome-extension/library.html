<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>iSnips Library</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body data-page="library">
    <div class="workspace">
      <aside class="workspace-sidebar">
        <div class="brand">
          <img src="icons/icon-48.png" alt="" width="28" height="28" /><span
            >iSnips</span
          >
        </div>
        <nav
          id="filters"
          class="filter-nav"
          data-i18n-label="library"
          aria-label="Library"
        >
          <button
            class="filter-button active"
            type="button"
            data-filter="all"
            aria-current="page"
          >
            <span data-icon="library"></span
            ><span data-i18n="all_items">All items</span
            ><span id="countAll" class="nav-count"></span>
          </button>
          <button class="filter-button" type="button" data-filter="web">
            <span data-icon="clip"></span><span data-i18n="clips">Clips</span
            ><span id="countWeb" class="nav-count"></span>
          </button>
          <button class="filter-button" type="button" data-filter="note">
            <span data-icon="note"></span><span data-i18n="notes">Notes</span
            ><span id="countNote" class="nav-count"></span>
          </button>
          <button class="filter-button" type="button" data-filter="clipboard">
            <span data-icon="copy"></span
            ><span data-i18n="clipboard">Clipboard</span>
            <span id="countClipboard" class="nav-count"></span>
          </button>
        </nav>
        <section class="folder-section" aria-labelledby="foldersTitle">
          <div class="folder-heading">
            <h2 id="foldersTitle" data-i18n="folders">Folders</h2>
            <button
              id="createFolder"
              class="icon-button"
              type="button"
              data-icon="plus"
              data-i18n-title="create_folder"
              aria-label="New folder"
            ></button>
          </div>
          <nav
            id="folderList"
            data-i18n-label="folders"
            aria-label="Folders"
          ></nav>
        </section>
        <div class="sidebar-spacer"></div>
        <button
          id="libraryTrash"
          class="filter-button trash-filter"
          type="button"
          data-filter="trash"
        >
          <span data-icon="trash"></span><span data-i18n="trash">Trash</span
          ><span id="countTrash" class="nav-count"></span>
        </button>
        <a
          id="librarySettings"
          class="filter-button settings-link"
          href="settings.html"
        >
          <span data-icon="settings"></span
          ><span data-i18n="settings">Settings</span>
        </a>
        <a
          class="coffee-link sidebar-coffee"
          href="https://buymeacoffee.com/istxingv"
          target="_blank"
          rel="noopener noreferrer"
          ><span data-icon="coffee" aria-hidden="true"></span
          ><span data-i18n="sponsor">Buy me a coffee</span></a
        >
      </aside>
      <main class="library-main">
        <div class="library-content">
          <header class="page-heading">
            <h1 id="pageTitle" data-i18n="all_items">All items</h1>
            <div class="heading-actions">
              <div id="clipboardControls" class="clipboard-controls hidden">
                <label class="clipboard-toggle"
                  ><input id="clipboardAuto" type="checkbox" />
                  <span data-i18n="clipboard_auto"
                    >Auto-save copies</span
                  ></label
                >
                <button
                  id="clearClipboard"
                  class="button secondary"
                  type="button"
                  data-i18n="clipboard_clear"
                >
                  Clear history
                </button>
              </div>
              <button
                id="emptyTrash"
                class="button danger hidden"
                type="button"
                data-i18n="empty_trash"
              >
                Empty trash
              </button>
              <button id="newNote" class="button primary" type="button">
                <span data-icon="plus"></span
                ><span data-i18n="new_note">Note</span>
              </button>
            </div>
          </header>
          <div class="library-toolbar">
            <label class="search-wrap"
              ><span data-icon="search"></span
              ><input
                id="searchInput"
                maxlength="200"
                type="search"
                data-i18n-label="search_placeholder"
                aria-label="Search"
                data-i18n-placeholder="search_placeholder"
                placeholder="Search"
            /></label>
            <span id="resultCount" class="result-count" role="status"></span>
            <div id="libraryView" class="view-switch" role="group" data-i18n-label="library_view" aria-label="View">
              <button type="button" data-library-view="day" aria-pressed="false" data-i18n="view_day">Day</button>
              <button type="button" data-library-view="week" aria-pressed="false" data-i18n="view_week">Week</button>
              <button type="button" data-library-view="month" aria-pressed="false" data-i18n="view_month">Month</button>
              <button type="button" data-library-view="all" aria-pressed="true" data-i18n="view_summary">All</button>
            </div>
            <select id="sortSelect" data-i18n-label="sort" aria-label="Sort">
              <option value="new" data-i18n="newest">Newest first</option>
              <option value="old" data-i18n="oldest">Oldest first</option>
            </select>
          </div>
          <p
            id="clipboardHint"
            class="context-hint hidden"
            data-i18n="clipboard_hint"
          >
            Last 99 copies, on this device. Save as a note to keep.
          </p>
          <p id="trashHint" class="context-hint hidden" data-i18n="trash_hint">
            Items in trash are removed after 30 days.
          </p>
          <div id="libraryGrid" class="library-grid" aria-busy="true">
            <p class="loading-state" data-i18n="loading">Loading…</p>
          </div>
          <div id="emptyState" class="empty-state hidden">
            <h2 id="emptyTitle" data-i18n="nothing_here">No items yet</h2>
            <p id="emptyDescription" data-i18n="empty_desc">
              Create a note or clip text from a page.
            </p>
          </div>
          <div class="library-pagination">
            <button
              id="previousPage"
              class="button secondary hidden"
              type="button"
              data-i18n="previous_page"
            >
              Previous
            </button>
            <span id="pageStatus" class="muted" role="status"></span>
            <button
              id="loadMore"
              class="button secondary load-more hidden"
              type="button"
              data-i18n="next_page"
            >
              Next
            </button>
          </div>
        </div>
      </main>
    </div>
    <dialog
      id="editorDialog"
      class="editor-dialog"
      aria-labelledby="editorTitle"
    >
      <form method="dialog" id="editorForm">
        <div class="dialog-heading">
          <h2 id="editorTitle" data-i18n="edit_item">Edit</h2>
          <button
            id="closeEditor"
            class="icon-button"
            type="button"
            data-icon="close"
            data-i18n-title="cancel"
            aria-label="Cancel"
          ></button>
        </div>
        <textarea
          id="editorText"
          rows="12"
          aria-labelledby="editorTitle"
          required
        ></textarea>
        <label class="folder-select-label"
          ><span data-i18n="folder">Folder</span
          ><select
            id="editorFolder"
            data-i18n-label="folder"
            aria-label="Folder"
          ></select
        ></label>
        <div class="dialog-actions">
          <button
            id="cancelEditor"
            class="button secondary"
            type="button"
            data-i18n="cancel"
          >
            Cancel</button
          ><button
            id="saveEditor"
            class="button primary"
            type="submit"
            data-i18n="save"
          >
            Save
          </button>
        </div>
      </form>
    </dialog>
    <dialog
      id="folderEditorDialog"
      class="editor-dialog"
      aria-labelledby="folderEditorTitle"
    >
      <form id="folderEditorForm">
        <div class="dialog-heading">
          <h2 id="folderEditorTitle" data-i18n="create_folder">New folder</h2>
          <button
            id="closeFolderEditor"
            class="icon-button"
            type="button"
            data-icon="close"
            data-i18n-title="close"
            aria-label="Close"
          ></button>
        </div>
        <input
          id="folderName"
          type="text"
          maxlength="40"
          required
          data-i18n-label="folder_name"
          aria-label="Folder name"
          autocomplete="off"
        />
        <div class="dialog-actions">
          <button
            id="deleteFolder"
            class="button danger hidden"
            type="button"
            data-i18n="delete_folder"
          >
            Delete folder</button
          ><button
            id="cancelFolderEditor"
            class="button secondary"
            type="button"
            data-i18n="cancel"
          >
            Cancel</button
          ><button
            id="saveFolder"
            class="button primary"
            type="submit"
            data-i18n="save"
          >
            Save
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
