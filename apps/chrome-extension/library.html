<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>iSnips Library</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body data-page="library">
    <div class="workspace">
      <aside class="workspace-sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">i</span
          ><span>iSnips</span>
        </div>
        <div class="nav-caption" data-i18n="workspace">WORKSPACE</div>
        <nav id="filters" class="filter-nav" aria-label="Filters">
          <button class="filter-button active" type="button" data-filter="all">
            <span class="nav-icon">▦</span
            ><span data-i18n="all_items">All items</span
            ><span id="countAll" class="nav-count"></span>
          </button>
          <button class="filter-button" type="button" data-filter="web">
            <span class="nav-icon">↗</span><span data-i18n="clips">Clips</span
            ><span id="countWeb" class="nav-count"></span>
          </button>
          <button class="filter-button" type="button" data-filter="note">
            <span class="nav-icon">✎</span><span data-i18n="notes">Notes</span
            ><span id="countNote" class="nav-count"></span>
          </button>
          <button class="filter-button" type="button" data-filter="trash">
            <span class="nav-icon">⌫</span><span data-i18n="trash">Trash</span
            ><span id="countTrash" class="nav-count"></span>
          </button>
        </nav>
        <div class="sidebar-spacer"></div>
        <button
          id="librarySettings"
          class="filter-button settings-link"
          type="button"
        >
          <span class="nav-icon">⚙</span
          ><span data-i18n="settings">Settings</span>
        </button>
        <a
          class="sidebar-sponsor sponsor-link"
          href="https://buymeacoffee.com/istxingv"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="sponsor"
          >Support iSnips</a
        >
        <div class="sidebar-foot" data-i18n="local_first">
          Your space, on your terms.
        </div>
      </aside>
      <main class="library-main">
        <header class="library-toolbar">
          <div class="mobile-brand brand">
            <span class="brand-mark" aria-hidden="true">i</span
            ><span>iSnips</span>
          </div>
          <label class="search-wrap"
            ><span aria-hidden="true">⌕</span
            ><input
              id="searchInput"
              type="search"
              data-i18n-placeholder="search_placeholder"
              placeholder="Search your collection"
          /></label>
          <button
            id="newNote"
            class="button primary"
            type="button"
            data-i18n="new_note"
          >
            + New note
          </button>
        </header>
        <div class="library-content">
          <div class="page-heading">
            <div>
              <div class="eyebrow" data-i18n="library_eyebrow">
                YOUR KNOWLEDGE, ORGANIZED
              </div>
              <h1 id="pageTitle" data-i18n="all_items">All items</h1>
              <p id="pageSubtitle" data-i18n="library_desc">
                Everything worth keeping, in one place.
              </p>
            </div>
            <button
              id="emptyTrash"
              class="button danger hidden"
              type="button"
              data-i18n="empty_trash"
            >
              Empty trash
            </button>
          </div>
          <div class="list-toolbar">
            <span id="resultCount"></span
            ><select id="sortSelect" aria-label="Sort">
              <option value="new" data-i18n="newest">Newest first</option>
              <option value="old" data-i18n="oldest">Oldest first</option>
            </select>
          </div>
          <div id="libraryGrid" class="library-grid" aria-live="polite"></div>
          <div id="emptyState" class="empty-state hidden">
            <span class="empty-glyph">✦</span>
            <h2 data-i18n="nothing_here">Nothing here yet</h2>
            <p data-i18n="empty_desc">
              Start with a note or save a selection from a page.
            </p>
          </div>
        </div>
      </main>
    </div>
    <dialog id="editorDialog" class="editor-dialog">
      <form method="dialog" id="editorForm">
        <div class="dialog-heading">
          <div>
            <div class="eyebrow" data-i18n="make_it_yours">MAKE IT YOURS</div>
            <h2 id="editorTitle" data-i18n="edit_item">Edit item</h2>
          </div>
          <button
            id="closeEditor"
            class="icon-button"
            type="button"
            data-i18n-title="cancel"
            aria-label="Cancel"
          >
            ×
          </button>
        </div>
        <textarea
          id="editorText"
          rows="10"
          maxlength="20000"
          required
        ></textarea>
        <div class="dialog-actions">
          <button
            id="cancelEditor"
            class="button secondary"
            type="button"
            data-i18n="cancel"
          >
            Cancel</button
          ><button
            id="saveEditor"
            class="button primary"
            type="submit"
            data-i18n="save_changes"
          >
            Save changes
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
