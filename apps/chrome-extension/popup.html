<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>iSnips</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body data-page="panel">
    <div class="panel-shell">
      <header class="panel-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">i</span
          ><span>iSnips</span>
        </div>
        <div class="header-actions">
          <button
            id="openLibrary"
            class="icon-button"
            type="button"
            data-i18n-title="library"
            aria-label="Library"
          >
            ▦
          </button>
          <button
            id="openSettings"
            class="icon-button"
            type="button"
            data-i18n-title="settings"
            aria-label="Settings"
          >
            ⚙
          </button>
        </div>
      </header>
      <main class="panel-main">
        <section class="composer card-surface" aria-labelledby="quickNoteTitle">
          <div class="section-heading">
            <h2 id="quickNoteTitle" data-i18n="quick_note">Quick note</h2>
            <span class="muted" id="noteCount">0</span>
          </div>
          <textarea
            id="noteInput"
            rows="2"
            maxlength="20000"
            data-i18n-placeholder="note_placeholder"
            placeholder="What's on your mind?"
          ></textarea>
          <div class="composer-footer">
            <label class="check-label"
              ><input id="attachPage" type="checkbox" checked /><span
                data-i18n="attach_page"
                >Attach current page</span
              ></label
            >
            <button
              id="saveNote"
              class="button primary"
              type="button"
              data-i18n="save_note"
            >
              Save note
            </button>
          </div>
        </section>
        <section class="recent-section" aria-labelledby="recentTitle">
          <div class="section-heading">
            <h2 id="recentTitle" data-i18n="recent">Recent</h2>
            <button
              id="viewAll"
              class="text-button"
              type="button"
              data-i18n="view_all"
            >
              View all →
            </button>
          </div>
          <div id="recentList" class="snippet-list" aria-live="polite"></div>
        </section>
      </main>
      <footer class="panel-footer">
        <span
          ><span id="panelCount">0</span>
          <span data-i18n="saved_items">saved items</span></span
        >
        <span class="footer-shortcut"
          ><span id="shortcutHint">Alt+C</span>
          <span data-i18n="to_clip">to clip selection</span></span
        >
        <a
          class="sponsor-link"
          href="https://buymeacoffee.com/istxingv"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="sponsor"
          >Support iSnips</a
        >
      </footer>
    </div>
    <dialog id="panelEditorDialog" class="editor-dialog panel-editor-dialog">
      <form method="dialog" id="panelEditorForm">
        <div class="dialog-heading">
          <h2 data-i18n="edit_item">Edit item</h2>
          <button
            id="panelCloseEditor"
            class="icon-button"
            type="button"
            data-i18n-title="cancel"
            aria-label="Cancel"
          >
            ×
          </button>
        </div>
        <textarea
          id="panelEditorText"
          rows="9"
          maxlength="20000"
          required
        ></textarea>
        <div class="dialog-actions">
          <button
            id="panelCancelEditor"
            class="button secondary"
            type="button"
            data-i18n="cancel"
          >
            Cancel
          </button>
          <button
            id="panelSaveEditor"
            class="button primary"
            type="submit"
            data-i18n="save_changes"
          >
            Save changes
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
